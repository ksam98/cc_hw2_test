services:
  mongodb:
    image: mongo:6
    container_name: todo-app-mongodb
    ports:
      - "27017:27017"           
    volumes:
      - mongodb-data:/data/db      
    restart: unless-stopped

  flask-app:
    build:
      context: .
    container_name: todo-app-flask
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - FLASK_ENV=production
      - PORT=5000
    ports:
      - "5001:5000"          
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb-data:
